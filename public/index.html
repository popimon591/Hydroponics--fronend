<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Mobile-first viewport: fills the full screen, including under notches -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Match the app background so there is no white flash on load -->
    <meta name="theme-color" content="#080F0B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Groxvel Agriculture" />

    <meta name="description" content="Groxvel Agriculture - Professional Hydroponics & Farm Monitoring" />

    <title>Groxvel</title>

    <!-- Prevent context-menu on long-press (native feel) -->
    <style>
      * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
      html, body, #root {
        margin: 0; padding: 0;
        background: #080F0B;
        overscroll-behavior: none;
      }
      /* Side insets (landscape notches) once here; top/bottom insets are
         applied by the fixed TopBar, BottomNav, sheets and Auth screen. */
      #root {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
