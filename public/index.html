<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Mobile-first viewport: prevents zooming, fills the full screen -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />

    <!-- Match the app background so there is no white flash on load -->
    <meta name="theme-color" content="#080F0B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Groxvel Agriculture" />

    <meta name="description" content="Groxvel Agriculture - Professional Hydroponics & Farm Monitoring" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Groxvel</title>

    <!-- Prevent context-menu on long-press (native feel) -->
    <style>
      * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
      html, body, #root {
        margin: 0; padding: 0;
        background: #080F0B;
        overscroll-behavior: none;
        /* Safe-area insets for notches / home indicators */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
